    "&hml_combo LA(LCTRL) (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_NON_US_BACKSLASH_AND_PIPE))": "<"


    # --- Tap-Dance Punctuation Mappings ---
    "&td_comma_semi": {t: ",", s: ";"}
    "&td_dot_colon": {t: ".", s: ":"}
    "&td_minus_under": {t: "-", s: "_"}
    "&mm_comma": {t: ",", s: ";"}
    "&mm_dot": {t: ".", s: ":"}
    "&mm_minus": {t: "-", s: "_"}

    # --- Sticky Modifiers ---
    "&sk LC(LSHFT)": "Ctrl+Shift"
    "&sk LC(LALT)": "Ctrl+Alt"

    # --- Custom Hold-Taps (Layer Activations & Comfort Keys) ---
    "&lt_k_repeat 5 TAB": {t: "TAB", h: "FUN"}
    "&lt_k_repeat 1 SPACE": {t: "SPC", h: "NAV"}
    "&my_triple_function": {t: "ENT", h: "CTL"}
    "&lt_k_repeat 4 ENTER": {t: "ENT", h: "SYM"}
    "&lt_k_repeat 2 BACKSPACE": {t: "BSP", h: "NUM"}
    "&shift_all LEFT_SHIFT 0": {t: "Magic", h: "Shift"}
    "&lrow_layer_to 7 V": {t: "V", h: "MAC"}
    "&soft_off": "Soft Off"

    # --- Mouse Controls ---
    "&mkp MB3": "Middle Click"
    "&mkp LCLK": "Left Click"
    "&mkp RCLK": "Right Click"
    "&mmv MOVE_LEFT": "Mouse Left"
    "&mmv MOVE_DOWN": "Mouse Down"
    "&mmv MOVE_UP": "Mouse Up"
    "&mmv MOVE_RIGHT": "Mouse Right"
    "&msc SCRL_LEFT": "Scroll Left"
    "&msc SCRL_DOWN": "Scroll Down"
    "&msc SCRL_UP": "Scroll Up"
    "&msc SCRL_RIGHT": "Scroll Right"

    # --- Custom Macros (Layer 8) ---
    "&a_tilde_m": "ã"
    "&o_caret_m": "ô"
    "&tilde_slash_m": "~/"
    "&not_eq_m": "!="
    "&eq_eq_m": "=="
    "&jlambda_m": "->"
    "&eq_gt_m": "=>"
    "&lt_eq_m": "<="
    "&gt_eq_m": ">="

    # --- Navigation / Other Controls ---
    "&key_repeat": "REPEAT"

# Styling configuration to make it look premium
draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  append_colon_to_layer_header: true
  svg_extra_style: |
    /* Add subtle shadow and modern rounded aesthetic */
    rect.key {
      stroke: #333;
      stroke-width: 1.5px;
      rx: 8px;
      ry: 8px;
    }
    rect.held {
      fill: #d5e8d4;
      stroke: #82b366;
    }
    text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
    }
    text.hold {
      fill: #0066cc;
      font-size: 10px;
      font-weight: 600;
    }
