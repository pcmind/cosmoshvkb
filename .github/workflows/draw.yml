name: Draw Keymap Layouts
on:
  push:
    paths:
      - 'config/unsplithk.keymap'
      - '.github/workflows/draw.yml'

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Parse keymap
        run: |
          keymap parse -z config/unsplithk.keymap > unsplithk.yaml

      - name: Draw keymap
        run: |
          keymap draw unsplithk.yaml > unsplithk.svg

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add unsplithk.yaml unsplithk.svg
          git commit -m "docs: auto-generate keymap SVG and YAML diagrams" || exit 0
          git push
