name: Draw Keymap Layouts
on:
  push:
    paths:
      - 'config/unsplithk.keymap'
      - '.github/workflows/draw.yml'

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Parse keymap
        run: |
          keymap -c keymap_drawer.config.yaml parse -z config/unsplithk.keymap > unsplithk.yaml

      - name: Fix custom physical layout
        run: |
          python3 -c "
          with open('unsplithk.yaml', 'r') as f:
              content = f.read()
          if 'layout:' not in content:
              content = 'layout: {cols_thumbs_notation: \"133333+3 3+333331\"}\n' + content
          else:
              content = content.replace('zmk_keyboard: unsplithk', 'cols_thumbs_notation: \"133333+3 3+333331\"')
          with open('unsplithk.yaml', 'w') as f:
              f.write(content)
          "

      - name: Draw keymap
        run: |
          keymap -c keymap_drawer.config.yaml draw unsplithk.yaml > unsplithk.svg

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add unsplithk.yaml unsplithk.svg
          git commit -m "docs: auto-generate keymap SVG and YAML diagrams" || exit 0
          git push
