name: Draw Keymap Layouts
on:
  push:
    paths:
      - 'config/unsplithk.keymap'
      - '.github/workflows/draw.yml'

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Parse keymap
        run: |
          keymap -c keymap_drawer.config.yaml parse -b unsplithk.yaml -z config/unsplithk.keymap > unsplithk.yaml.tmp && mv unsplithk.yaml.tmp unsplithk.yaml

      - name: Generate custom physical layout coordinates
        run: |
          python3 generate_layout.py

      - name: Draw keymap
        run: |
          keymap -c keymap_drawer.config.yaml draw -j unsplithk_info.json unsplithk.yaml > unsplithk.svg

      - name: Commit and Push Layout Diagrams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add unsplithk.yaml unsplithk_info.json unsplithk.svg
          git commit -m "docs: auto-generate keymap SVG and YAML diagrams with custom physical layout" || exit 0
          git push
